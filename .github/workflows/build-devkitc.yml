
name: Build RuView for ESP32-S3 DevKitC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/firmware/esp32-csi-node:/project" \
            -w /project \
            espressif/idf:v5.4 \
            bash -c "idf.py -DSDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.defaults.devkitc' set-target esp32s3 && idf.py -DSDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.defaults.devkitc' build"

      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: ruview-esp32s3-devkitc
          path: |
            firmware/esp32-csi-node/build/bootloader/bootloader.bin
            firmware/esp32-csi-node/build/partition_table/partition-table.bin
            firmware/esp32-csi-node/build/ota_data_initial.bin
            firmware/esp32-csi-node/build/esp32-csi-node.bin
